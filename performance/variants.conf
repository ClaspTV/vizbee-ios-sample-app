# The app builds to compare: label, git ref (branch or commit), and an optional discovery check.
# The first line is the baseline that every other build is compared with.
# The discovery check is a pattern that must appear in the device's network traffic within
# 15 s of launch; it confirms discovery runs (for example that Local Network access is allowed).
no-sdk           origin/performance/no-sdk
vizbee-sdk       origin/performance/vizbee-sdk         > 239.255.255.250.1900:
google-cast-sdk  origin/performance/google-cast-sdk    _googlecast._tcp.local
