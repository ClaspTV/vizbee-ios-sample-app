# The app builds to compare: label, git ref (branch or commit), and an optional discovery type.
# The first line is the baseline that every other build is compared with.
# The discovery type (ssdp, googlecast, or any for both) is checked by the smoke test: within 15 s of launch
# the app must send discovery probes and at least one TV must answer.
no-sdk           origin/performance/no-sdk
vizbee-sdk       origin/performance/vizbee-sdk         any
google-cast-sdk  origin/performance/google-cast-sdk    googlecast
